[package]
name = "token-usage-desktop"
version = "0.4.0"
description = "Token Usage desktop companion — tray monitor for tokenusage-cli"
authors = ["baiwumm"]
license = "MIT"
edition = "2021"

[lib]
name = "token_usage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
