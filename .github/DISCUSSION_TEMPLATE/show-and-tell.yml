title: "[Show & tell] "
body:
  - type: markdown
    attributes:
      value: |
        Share your setup: dashboard screenshots, badge, sources, cost insights. Screenshots are welcome — just make sure no secrets are visible.
  - type: input
    id: what
    attributes:
      label: What are you sharing?
      placeholder: My self-hosted dashboard after one month
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Details
      description: What you collect, how you deployed it, anything surprising in the numbers.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or links
      description: Paste images directly, or link to your public page.
  - type: input
    id: stack
    attributes:
      label: Stack and sources
      placeholder: Next.js + Supabase, Claude Code / Codex / Cursor
  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: Screenshots contain no secrets, tokens, emails or private paths.
          required: true
