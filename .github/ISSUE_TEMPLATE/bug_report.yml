name: Bug report
description: Report a reproducible problem in the collector, dashboard, desktop app or docs
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This form is for **reproducible bugs**.

        Setup, deployment and usage questions belong in [Discussions Q&A](https://github.com/baiwumm/token-usage/discussions/categories/q-a); security problems must go through [private reporting](https://github.com/baiwumm/token-usage/security/advisories/new).

        **Never paste secrets** — service-role keys, device tokens, pairing codes or Supabase credentials. Redact logs and screenshots.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Collector CLI
        - Dashboard (web)
        - Desktop app
        - Self-hosted deployment
        - Sources & pricing
        - Docs or landing page
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `tokenusage --version`, or the desktop app version / commit SHA.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Token Usage?
      options:
        - Self-hosted (my own Supabase)
        - Official demo instance (demo.token-usage.cc)
        - Local development (pnpm dev)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: What you expected, what happened, and the exact error message.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Only the lines that matter. Remove secrets and absolute paths first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues, discussions and the docs.
          required: true
        - label: I removed every secret (service-role key, device token, pairing code) from this report.
          required: true
